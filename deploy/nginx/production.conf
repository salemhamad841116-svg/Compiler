# ==============================================================================
# Production Reverse Proxy Configuration for Multi-Domain Ecosystem
# Subdomains:
#   - api.msruq.com      -> Backend Node.js API & Data Vault
#   - waraqa.msruq.com   -> Supervisor Ingestion Dashboard
#   - bahth.masruq.com   -> User RAG Chat Assistant
#   - logs.msruq.com     -> Super Admin Master Control & Audit Logs
# ==============================================================================

# Common upstream for backend API
# Cloudflare Real IP Restoration
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream backend_upstream {
    server rag-backend:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Backend API & Data Vault (api.msruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.msruq.com api.masruq.com api.misruq.com;

    # Ingestion media and book uploads require larger payload limits
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Proxy timeouts for heavy PDF extraction & video/audio transcription
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. Supervisor Data Entry Portal (waraqa.msruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name waraqa.msruq.com waraqa.masruq.com waraqa.misruq.com;

    client_max_body_size 100M;
    root /var/www/public/supervisor;
    index index.html;

    # Proxy API requests directly to backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Serve static SPA files
    # Shared frontend assets (served from the common public root)
    location /js/      { alias /var/www/public/js/; }
    location /css/     { alias /var/www/public/css/; }
    location /locales/ { alias /var/www/public/locales/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. End-User RAG Chat Interface (bahth.masruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name bahth.msruq.com bahth.masruq.com bahth.misruq.com;

    root /var/www/public/chat;
    index index.html;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared frontend assets (served from the common public root)
    location /js/      { alias /var/www/public/js/; }
    location /css/     { alias /var/www/public/css/; }
    location /locales/ { alias /var/www/public/locales/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 4. Super Admin Master Dashboard (logs.msruq.com / admin.msruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name logs.msruq.com logs.masruq.com logs.misruq.com admin.msruq.com admin.masruq.com admin.misruq.com;

    root /var/www/public/admin;
    index index.html;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared frontend assets (served from the common public root)
    location /js/      { alias /var/www/public/js/; }
    location /css/     { alias /var/www/public/css/; }
    location /locales/ { alias /var/www/public/locales/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
