server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json;

    # Real-time dashboard events (Server-Sent Events): unbuffered, long-lived stream.
    location = /api/events {
        proxy_pass http://masruq_rag_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://masruq_rag_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Shared frontend assets. no-cache = always revalidate (ETag), so a deploy is picked up at once
    # by browsers, Cloudflare and the PWA service workers.
    location /js/      { alias /var/www/public/js/;      add_header Cache-Control "no-cache" always; }
    location /css/     { alias /var/www/public/css/;     add_header Cache-Control "no-cache" always; }
    location /locales/ { alias /var/www/public/locales/; add_header Cache-Control "no-cache" always; }

    # PWA: the service worker and manifest must always be revalidated so updates roll out immediately.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        # App shell (index.html, app.js, style.css): revalidate on every load so deploys are instant.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
