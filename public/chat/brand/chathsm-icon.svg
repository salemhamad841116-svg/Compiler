<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ChatHSM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="100%" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c5cf5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Solid rounded square base (used for Apple Touch / PWA backgrounds; ignored visually when used as transparent mark thanks to currentColor strategy in variants) -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- Safe area: marks live within ~12% inset (123px) -->
  <g transform="translate(192 176)">
    <!-- Chat bubble silhouette with rounded tail, filled with brand gradient -->
    <path
      d="M80 0 H560 a80 80 0 0 1 80 80 V440 a80 80 0 0 1 -80 80 H260 L132 632 a16 16 0 0 1 -26 -12 V520 H80 a80 80 0 0 1 -80 -80 V80 A80 80 0 0 1 80 0 Z"
      fill="url(#brand)"
    />
    <!-- Subtle inner highlight -->
    <path
      d="M80 0 H560 a80 80 0 0 1 80 80 V200 H0 V80 A80 80 0 0 1 80 0 Z"
      fill="#ffffff" fill-opacity="0.10"
    />

    <!-- Stylized H monogram, centered in the bubble body -->
    <g fill="#ffffff">
      <rect x="170" y="140" width="56" height="280" rx="14"/>
      <rect x="414" y="140" width="56" height="280" rx="14"/>
      <rect x="170" y="262" width="300" height="44" rx="14"/>
    </g>
    <!-- Spark accent atop the H crossbar -->
    <g transform="translate(560 130)" fill="#ffffff">
      <path d="M0 -28 L8 -8 L28 0 L8 8 L0 28 L-8 8 L-28 0 L-8 -8 Z"/>
    </g>
  </g>
</svg>
