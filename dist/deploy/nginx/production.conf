# ==============================================================================
# Production Reverse Proxy Configuration for Multi-Domain Ecosystem
# Subdomains:
#   - api.misruq.com      -> Backend Node.js API & Data Vault (masruq_rag_backend)
#   - waraqa.misruq.com   -> Supervisor Ingestion Dashboard (masruq_waraqa_frontend)
#   - bahth.misruq.com    -> User RAG Chat Assistant (masruq_bahth_frontend)
#   - logs.misruq.com     -> Super Admin Control & Audit Logs (masruq_admin_frontend)
#   - admin.misruq.com    -> Super Admin Control Alias (masruq_admin_frontend)
# ==============================================================================

# Cloudflare Real IP Restoration
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Docker internal DNS resolver
resolver 127.0.0.11 valid=30s ipv6=off;

# ------------------------------------------------------------------------------
# Upstreams (Primary container name + Compose service name fallback)
# ------------------------------------------------------------------------------
upstream backend_upstream {
    server masruq_rag_backend:3000 max_fails=3 fail_timeout=10s;
    server rag-backend:3000 backup;
    keepalive 32;
}

upstream waraqa_frontend_upstream {
    server masruq_waraqa_frontend:80 max_fails=3 fail_timeout=10s;
    server waraqa-frontend:80 backup;
    keepalive 32;
}

upstream admin_frontend_upstream {
    server masruq_admin_frontend:80 max_fails=3 fail_timeout=10s;
    server admin-frontend:80 backup;
    keepalive 32;
}

upstream bahth_frontend_upstream {
    server masruq_bahth_frontend:80 max_fails=3 fail_timeout=10s;
    server bahth-frontend:80 backup;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Backend API & Data Vault (api.misruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.misruq.com api.msruq.com api.masruq.com;

    client_max_body_size 1024M;
    client_body_buffer_size 16M;
    client_body_timeout 1800s;

    proxy_connect_timeout 60s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Real-time dashboard events (Server-Sent Events): unbuffered, long-lived stream.
    location = /api/events {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. Supervisor Data Entry Portal (waraqa.misruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name waraqa.misruq.com waraqa.msruq.com waraqa.masruq.com;

    client_max_body_size 1024M;
    client_body_timeout 1800s;

    # Real-time dashboard events (Server-Sent Events): unbuffered, long-lived stream.
    location = /api/events {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Shared frontend assets. no-cache = always revalidate (ETag), so a deploy is picked up at once
    # by browsers, Cloudflare and the PWA service workers.
    location /js/      { alias /var/www/public/js/;      add_header Cache-Control "no-cache" always; }
    location /css/     { alias /var/www/public/css/;     add_header Cache-Control "no-cache" always; }
    location /locales/ { alias /var/www/public/locales/; add_header Cache-Control "no-cache" always; }

    location / {
        proxy_pass http://waraqa_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

