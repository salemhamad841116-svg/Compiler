# ==============================================================================
# Production Reverse Proxy Configuration for Multi-Domain Ecosystem
# Subdomains:
#   - api.msruq.com      -> Backend Node.js API & Data Vault
#   - waraqa.msruq.com   -> Supervisor Ingestion Dashboard
#   - bahth.masruq.com   -> User RAG Chat Assistant
#   - logs.msruq.com     -> Super Admin Master Control & Audit Logs
# ==============================================================================

# Common upstream for backend API
upstream backend_upstream {
    server rag-backend:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Backend API & Data Vault (api.msruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.msruq.com api.masruq.com;

    # Ingestion media and book uploads require larger payload limits
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Proxy timeouts for heavy PDF extraction & video/audio transcription
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. Supervisor Data Entry Portal (waraqa.msruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name waraqa.msruq.com waraqa.masruq.com;

    client_max_body_size 100M;
    root /var/www/public/supervisor;
    index index.html;

    # Proxy API requests directly to backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Serve static SPA files
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. End-User RAG Chat Interface (bahth.masruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name bahth.masruq.com bahth.msruq.com;

    root /var/www/public/chat;
    index index.html;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 4. Super Admin Master Dashboard (logs.msruq.com / admin.msruq.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name logs.msruq.com logs.masruq.com admin.msruq.com;

    root /var/www/public/admin;
    index index.html;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
