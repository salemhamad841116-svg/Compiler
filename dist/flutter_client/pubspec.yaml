name: flutter_client
description: "Cross-platform Flutter client for Private Gemini-Powered RAG Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  http_parser: ^4.0.2
  flutter_markdown: ^0.7.3
  google_fonts: ^6.2.1
  file_picker: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
