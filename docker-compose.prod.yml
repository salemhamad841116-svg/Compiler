version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Private RAG Backend & Data Vault API (api.misruq.com) - open-source AI (Phase 5)
  # ----------------------------------------------------------------------------
  rag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: masruq-rag-backend:latest
    container_name: masruq_rag_backend
    restart: unless-stopped
    # Later files override earlier ones. AI keys are managed in Admin > System Settings
    # (or LLM_API_KEY in either file on the server)
    # (.env is optional; requires Docker Compose v2.24+ for the `required` flag).
    # NOTE: .env is excluded from the image by .dockerignore, so it ONLY reaches the
    # container through this env_file entry.
    env_file:
      - path: .env.production
        required: true
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - DATA_VAULT_PATH=/app/data/vault
      - VECTOR_DB_PATH=/app/data/vector_store.json
      - CATEGORIES_FILE_PATH=/app/data/categories.json
      # Local open-source AI endpoint (embeddings by default). Docker DNS: container name.
      - LOCAL_AI_BASE_URL=http://masruq_ollama:11434/v1
      - CLOUD_AI_PRESET=together
      - MAX_FILE_MB=1024
      - MAX_MEDIA_MB=1024
    volumes:
      # Permanent Production Data Lake Volume (Never lost on container restart)
      - rag_production_data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_started
    networks:
      masruq_network:
        aliases:
          - masruq_rag_backend
          - rag-backend

  # ----------------------------------------------------------------------------
  # 1b. Local open-source AI engine (Ollama). Serves the bge-m3 embedding model on CPU,
  #     so the whole vector index is computed on this server. Internal network only:
  #     NO published port. Can later serve Llama locally (Option A) by adding a GPU.
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: masruq_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      masruq_network:
        aliases:
          - masruq_ollama
    # Option A (local Llama on a GPU VM): uncomment after installing nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads the embedding model into the ollama volume on first start
  # (~1.2 GB for bge-m3; later starts finish in seconds because the model is cached).
  ollama-init:
    image: ollama/ollama:latest
    container_name: masruq_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://masruq_ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull bge-m3 && echo 'bge-m3 ready'"]
    networks:
      - masruq_network

  # ----------------------------------------------------------------------------
  # 2. Standalone Supervisor Data Entry Frontend (waraqa.misruq.com)
  # ----------------------------------------------------------------------------
  waraqa-frontend:
    image: nginx:alpine
    container_name: masruq_waraqa_frontend
    restart: unless-stopped
    volumes:
      - ./public/supervisor:/usr/share/nginx/html:ro
      - ./public:/var/www/public:ro
      - ./deploy/nginx/supervisor-standalone.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - rag-backend
    networks:
      masruq_network:
        aliases:
          - masruq_waraqa_frontend
          - waraqa-frontend
          - supervisor-frontend

  # ----------------------------------------------------------------------------
  # 3. Standalone Super Admin Dashboard Frontend (logs.misruq.com / admin.misruq.com)
  # ----------------------------------------------------------------------------
  admin-frontend:
    image: nginx:alpine
    container_name: masruq_admin_frontend
    restart: unless-stopped
    volumes:
      - ./public/admin:/usr/share/nginx/html:ro
      - ./public:/var/www/public:ro
      - ./deploy/nginx/admin-standalone.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - rag-backend
    networks:
      masruq_network:
        aliases:
          - masruq_admin_frontend
          - admin-frontend
          - logs-frontend

  # ----------------------------------------------------------------------------
  # 4. Standalone Public User Chat Interface Frontend (bahth.misruq.com)
  # ----------------------------------------------------------------------------
  bahth-frontend:
    image: nginx:alpine
    container_name: masruq_bahth_frontend
    restart: unless-stopped
    volumes:
      - ./public/chat:/usr/share/nginx/html:ro
      - ./public:/var/www/public:ro
      - ./deploy/nginx/bahth-standalone.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"
    depends_on:
      - rag-backend
    networks:
      masruq_network:
        aliases:
          - masruq_bahth_frontend
          - bahth-frontend
          - chat-frontend

  # ----------------------------------------------------------------------------
  # 5. Enterprise Gateway Reverse Proxy (Subdomain Dispatch & Cloudflare Ingress)
  # ----------------------------------------------------------------------------
  gateway-proxy:
    image: nginx:alpine
    container_name: masruq_gateway_proxy
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - rag-backend
      - waraqa-frontend
      - admin-frontend
      - bahth-frontend
    networks:
      masruq_network:
        aliases:
          - masruq_gateway_proxy
          - gateway-proxy

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  rag_production_data:
    name: masruq_rag_production_vault_data
    driver: local
  ollama_models:
    name: masruq_ollama_models
    driver: local

networks:
  masruq_network:
    name: masruq_enterprise_network
    driver: bridge
